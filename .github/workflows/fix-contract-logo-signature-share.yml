name: Corrigir logo e envio de assinatura

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-contract-logo-signature-share.yml'

permissions:
  contents: write

jobs:
  fix-documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aplicar melhorias nos documentos
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Logo oficial nos PDFs
          print_path = Path('crm/app/operations/contract-print.ts')
          content = print_path.read_text(encoding='utf-8')

          marker = '  const client = snapshot.client;\n'
          addition = '  const logoUrl = new URL("/api/brand-logo?v=9", window.location.origin).href;\n'
          if addition not in content:
              if content.count(marker) != 1:
                  raise SystemExit('Marcador do cliente não encontrado no gerador de PDF.')
              content = content.replace(marker, marker + addition, 1)

          old_css = '.mark{width:45px;height:45px;display:grid;place-items:center;border-radius:13px;background:#0b1530;color:#fff;font-weight:900}'
          new_css = '.brand-logo{width:54px;height:54px;display:block;object-fit:contain}'
          if old_css in content:
              content = content.replace(old_css, new_css, 1)
          elif new_css not in content:
              raise SystemExit('Estilo da marca não encontrado no PDF.')

          old_mark = '<div class="mark">NS</div>'
          new_mark = '<img class="brand-logo" src="${escapeHtml(logoUrl)}" alt="Nassusinfo"/>'
          if old_mark in content:
              content = content.replace(old_mark, new_mark, 1)
          elif new_mark not in content:
              raise SystemExit('Marca genérica não encontrada no PDF.')

          old_script = '<script>window.onload=()=>setTimeout(()=>window.print(),300)<\\/script>'
          new_script = '<script>window.onload=()=>{const images=[...document.images];Promise.all(images.map((image)=>image.complete?Promise.resolve():new Promise((resolve)=>{image.onload=resolve;image.onerror=resolve}))).finally(()=>setTimeout(()=>window.print(),250))}<\\/script>'
          if old_script in content:
              content = content.replace(old_script, new_script, 1)
          elif new_script not in content:
              raise SystemExit('Script de impressão não encontrado.')

          print_path.write_text(content, encoding='utf-8')

          # 2) Link de assinatura visível e envio pelo WhatsApp
          center_path = Path('crm/app/operations/documents-center.tsx')
          content = center_path.read_text(encoding='utf-8')

          copy_block = '''  async function copy(value: string, message: string) {
    await navigator.clipboard.writeText(value);
    setNotice(message);
  }
'''
          whatsapp_block = '''  async function copy(value: string, message: string) {
    await navigator.clipboard.writeText(value);
    setNotice(message);
  }

  function openWhatsApp(message: string) {
    window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, "_blank", "noopener,noreferrer");
  }
'''
          if whatsapp_block not in content:
              if content.count(copy_block) != 1:
                  raise SystemExit('Função de cópia não encontrada de forma única.')
              content = content.replace(copy_block, whatsapp_block, 1)

          kpi_end = '''        </section>
        <section className="pro-panel document-center-panel">'''
          guide = '''        </section>
        <aside className="signature-guide"><div><strong>Enviar contrato para assinatura</strong><span>No card do contrato, clique em “Enviar para assinatura”. O CRM abrirá o link privado e o código para copiar ou enviar pelo WhatsApp.</span></div></aside>
        <section className="pro-panel document-center-panel">'''
          if guide not in content:
              if content.count(kpi_end) < 1:
                  raise SystemExit('Posição do guia de assinatura não encontrada.')
              content = content.replace(kpi_end, guide, 1)

          old_button = '{link && ["active", "opened"].includes(link.status) ? "Novo link" : "Gerar link"}'
          new_button = '{link && ["active", "opened"].includes(link.status) ? "Gerar novo link" : "Enviar para assinatura"}'
          if old_button in content:
              content = content.replace(old_button, new_button, 1)
          elif new_button not in content:
              raise SystemExit('Texto do botão de assinatura não encontrado.')

          old_footer = '''<footer><button type="button" className="business-secondary" onClick={() => void copy(`Olá! Segue o link privado para leitura e assinatura do contrato: ${share.url}\\n\\nPor segurança, enviarei o código de acesso em outra mensagem.`, "Mensagem copiada.")}>Copiar mensagem</button><button type="button" className="pro-primary" onClick={() => setShare(null)}>Concluir</button></footer>'''
          new_footer = '''<footer><button type="button" className="business-secondary" onClick={() => void copy(`Olá! Segue o link privado para leitura e assinatura do contrato: ${share.url}\\n\\nPor segurança, enviarei o código de acesso em outra mensagem.`, "Mensagem copiada.")}>Copiar mensagem</button><button type="button" className="business-secondary" onClick={() => openWhatsApp(`Olá! Segue o link privado para leitura e assinatura do contrato: ${share.url}\\n\\nPor segurança, enviarei o código de acesso em outra mensagem.`)}>Enviar link no WhatsApp</button><button type="button" className="business-secondary" onClick={() => openWhatsApp(`Código de acesso do contrato: ${share.code}`)}>Enviar código no WhatsApp</button><button type="button" className="pro-primary" onClick={() => setShare(null)}>Concluir</button></footer>'''
          if old_footer in content:
              content = content.replace(old_footer, new_footer, 1)
          elif new_footer not in content:
              raise SystemExit('Rodapé da janela de compartilhamento não encontrado.')

          center_path.write_text(content, encoding='utf-8')

          # 3) Acabamento visual
          css_path = Path('crm/app/contracts-signing.css')
          css = css_path.read_text(encoding='utf-8')
          addition = '''

.signature-guide {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  margin: 0 0 18px;
  padding: 16px 18px;
  border: 1px solid rgba(53, 212, 255, .2);
  border-radius: 14px;
  background: linear-gradient(135deg, rgba(53, 212, 255, .09), rgba(124, 108, 255, .05));
}

.signature-guide div { display: grid; gap: 4px; }
.signature-guide strong { color: #f5f8ff; font-size: 14px; }
.signature-guide span { color: #98a5bb; font-size: 12px; line-height: 1.5; }
.share-modal footer { flex-wrap: wrap; }
.share-modal footer .business-secondary { flex: 1 1 180px; }

@media (max-width: 680px) {
  .signature-guide { align-items: flex-start; }
  .share-modal footer button { width: 100%; }
}
'''
          if '.signature-guide {' not in css:
              css += addition
              css_path.write_text(css, encoding='utf-8')
          PY

      - name: Publicar correções
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crm/app/operations/contract-print.ts crm/app/operations/documents-center.tsx crm/app/contracts-signing.css
          git commit -m 'fix(crm): usar logo oficial e facilitar envio para assinatura'
          git push
