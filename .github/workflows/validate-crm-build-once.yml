name: Validar build do Nassus CRM

on:
  push:
    paths:
      - '.github/workflows/validate-crm-build-once.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crm/package-lock.json
      - name: Validar TypeScript e build
        id: validate
        shell: bash
        run: |
          set +e
          cd crm
          npm ci > /tmp/crm-build.log 2>&1
          install_code=$?
          if [ "$install_code" -eq 0 ]; then
            npm run typecheck >> /tmp/crm-build.log 2>&1
            type_code=$?
          else
            type_code=$install_code
          fi
          if [ "$type_code" -eq 0 ]; then
            npm run build >> /tmp/crm-build.log 2>&1
            build_code=$?
          else
            build_code=$type_code
          fi
          cd ..
          {
            echo "Nassus CRM build validation"
            echo "Commit: $GITHUB_SHA"
            echo "Install exit: $install_code"
            echo "Typecheck exit: $type_code"
            echo "Build exit: $build_code"
            echo "Validated at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "Last log lines:"
            tail -n 180 /tmp/crm-build.log
          } > .github/crm-build-validation.txt
      - name: Publicar relatório da validação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/crm-build-validation.txt
          git commit -m "Registrar validação do build do CRM"
          git push
