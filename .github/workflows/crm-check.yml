name: CRM Check

on:
  pull_request:
    paths:
      - "crm/**"
      - ".github/workflows/crm-check.yml"
  push:
    branches:
      - main
    paths:
      - "crm/**"
      - ".github/workflows/crm-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Nassus CRM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build CRM
        run: npm run build
