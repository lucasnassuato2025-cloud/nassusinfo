name: Instalar preenchimento automático de CEP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-crm-cep-autofill.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Integrar componente no cadastro
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crm/app/crm-pro.tsx')
          content = path.read_text(encoding='utf-8')

          import_marker = 'import { neonClient } from "@/lib/neon";'
          import_line = 'import { CepAddressFields } from "@/components/cep-address-fields";'
          if import_line not in content:
              if content.count(import_marker) != 1:
                  raise SystemExit('Importação do Neon não encontrada de forma única.')
              content = content.replace(import_marker, import_marker + '\n' + import_line, 1)

          start_marker = '        <div className="form-section"><div className="form-section-title"><strong>Endereço</strong>'
          end_marker = '        <div className="form-section"><div className="form-section-title"><strong>Comercial</strong>'
          if content.count(start_marker) != 1 or content.count(end_marker) != 1:
              raise SystemExit('Blocos do formulário não foram encontrados de forma única.')

          start = content.index(start_marker)
          end = content.index(end_marker, start)
          replacement = '''        <CepAddressFields
          value={{
            zipCode: clientDraft.zipCode,
            address: clientDraft.address,
            addressNumber: clientDraft.addressNumber,
            complement: clientDraft.complement,
            neighborhood: clientDraft.neighborhood,
            city: clientDraft.city,
            state: clientDraft.state,
          }}
          onChange={(address) => setClientDraft((current) => ({ ...current, ...address }))}
        />\n'''
          content = content[:start] + replacement + content[end:]
          path.write_text(content, encoding='utf-8')
          PY

      - name: Publicar integração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crm/app/crm-pro.tsx
          git commit -m 'feat(crm): preencher endereço automaticamente pelo CEP'
          git push
