name: Remover área do cliente do site

on:
  push:
    paths:
      - '.github/workflows/remove-client-area-once.yml'

permissions:
  contents: write

jobs:
  remove-client-area:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Remover link do CRM da página pública
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          content = path.read_text(encoding="utf-8")
          block = '''<script>
          const crmUrl='https://crm.nassusinfo.com.br';
          const clientArea='<a href="'+crmUrl+'" target="_blank" rel="noopener">&Aacute;rea do cliente</a>';
          const budgetButton=document.querySelector('.nav-links .btn-primary');
          if(budgetButton) budgetButton.insertAdjacentHTML('beforebegin',clientArea);
          const footerNavigation=document.querySelector('.footer-col');
          if(footerNavigation) footerNavigation.insertAdjacentHTML('beforeend',clientArea);
          </script>
          '''

          if block not in content:
              raise SystemExit("Bloco da área do cliente não foi encontrado; nenhuma alteração aplicada.")

          path.write_text(content.replace(block, ""), encoding="utf-8")

      - name: Publicar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remover área do cliente do site público"
          git push
