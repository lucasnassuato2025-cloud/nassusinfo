name: CRM Production Deploy

on:
  workflow_run:
    workflows: ["CRM Check"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_wDTo6BRtKOdg6qbq4ugvsqp5
  VERCEL_PROJECT_ID: prj_XZdZH1xptRqMaXm6bzJLkehkJK8x

jobs:
  deploy:
    name: Deploy CRM after green checks
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tested main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Require Vercel deployment credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN ainda não está configurado no repositório."
            echo "O deploy automático permanece bloqueado por segurança; nenhum token é salvo no código."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@58.1.0

      - name: Link exact production project
        working-directory: crm
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull production settings
        working-directory: crm
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build exactly what passed main
        working-directory: crm
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt production
        working-directory: crm
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
