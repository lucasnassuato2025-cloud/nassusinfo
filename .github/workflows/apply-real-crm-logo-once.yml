name: Aplicar logo real e favicon no CRM

on:
  push:
    paths:
      - '.github/workflows/apply-real-crm-logo-once.yml'

permissions:
  contents: write

jobs:
  apply-real-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar conversor de imagens
        run: python -m pip install --quiet pillow

      - name: Aplicar logo real e favicons
        shell: python
        run: |
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          import base64

          original = base64.b64decode("")
          source = Image.open(BytesIO(original)).convert("RGBA")

          public_dir = Path("crm/public")
          app_dir = Path("crm/app")
          public_dir.mkdir(parents=True, exist_ok=True)
          app_dir.mkdir(parents=True, exist_ok=True)

          source.resize((256, 256), Image.Resampling.NEAREST).save(public_dir / "nassus-crm-logo.png", optimize=True)
          source.resize((512, 512), Image.Resampling.NEAREST).save(app_dir / "icon.png", optimize=True)
          source.resize((180, 180), Image.Resampling.NEAREST).save(app_dir / "apple-icon.png", optimize=True)
          source.save(app_dir / "favicon.ico", format="ICO", sizes=[(16, 16), (32, 32), (48, 48), (64, 64)])

          old_mark = '<span aria-hidden="true">N</span>'
          new_mark = '<span className="brand-symbol" aria-hidden="true"><img src="/nassus-crm-logo.png" alt="" /></span>'

          for filename in ["crm/app/sign-in/page.tsx", "crm/app/dashboard-client.tsx"]:
              path = Path(filename)
              content = path.read_text(encoding="utf-8")
              if old_mark not in content:
                  raise SystemExit(f"Símbolo genérico não encontrado em {filename}")
              path.write_text(content.replace(old_mark, new_mark), encoding="utf-8")

          css_path = Path("crm/app/globals.css")
          css = css_path.read_text(encoding="utf-8")
          marker = "/* Logo real do CRM */"
          if marker not in css:
              css += '''

/* Logo real do CRM */
.login-brand > .brand-symbol,
.crm-brand > .brand-symbol {
  overflow: hidden;
  padding: 0;
  background: #050b17;
  background-image: none;
  color: transparent;
  font-size: 0;
}

.brand-symbol img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: inherit;
}
'''
          css_path.write_text(css, encoding="utf-8")

          layout_path = Path("crm/app/layout.tsx")
          layout = layout_path.read_text(encoding="utf-8")
          old_icons = '  icons: { icon: "/icon.svg", shortcut: "/icon.svg", apple: "/nassus-logo.svg" },'
          new_icons = '''  icons: {
    icon: [
      { url: "/favicon.ico?v=5", sizes: "any" },
      { url: "/icon.png?v=5", type: "image/png", sizes: "512x512" },
    ],
    shortcut: "/favicon.ico?v=5",
    apple: "/apple-icon.png?v=5",
  },'''
          if old_icons in layout:
              layout = layout.replace(old_icons, new_icons)
          elif 'shortcut: "/favicon.ico?v=5"' not in layout:
              raise SystemExit("Configuração antiga de ícones não encontrada.")
          layout_path.write_text(layout, encoding="utf-8")

          old_svg = app_dir / "icon.svg"
          if old_svg.exists():
              old_svg.unlink()

      - name: Publicar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crm/app crm/public
          git commit -m "Usar logo real e favicon compatível no CRM"
          git push
