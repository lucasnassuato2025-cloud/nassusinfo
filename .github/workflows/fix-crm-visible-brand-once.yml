name: Corrigir marca visual do CRM

on:
  push:
    paths:
      - '.github/workflows/fix-crm-visible-brand-once.yml'

permissions:
  contents: write

jobs:
  fix-crm-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Restaurar símbolo limpo do CRM
        shell: python
        run: |
          from pathlib import Path

          path = Path('crm/app/globals.css')
          content = path.read_text(encoding='utf-8')
          marker = '/* Marca original Nassus */'

          if marker not in content:
              raise SystemExit('Bloco visual da marca não encontrado.')

          content = content.split(marker, 1)[0].rstrip() + '\n'
          path.write_text(content, encoding='utf-8')

      - name: Publicar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crm/app/globals.css
          git commit -m "Restaurar marca visual limpa do CRM"
          git push
