name: Aplicar marca original e favicons

on:
  push:
    paths:
      - '.github/workflows/apply-original-brand-once.yml'

permissions:
  contents: write

jobs:
  apply-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Aplicar favicon e marca original
        shell: python
        run: |
          from pathlib import Path
          import re

          favicon = '  <link rel="icon" type="image/svg+xml" href="/nassus-logo.svg">\n'
          for path in Path('.').glob('*.html'):
              content = path.read_text(encoding='utf-8')
              if 'rel="icon"' not in content:
                  content = content.replace('</head>', favicon + '</head>', 1)
              path.write_text(content, encoding='utf-8')

          home = Path('index.html')
          content = home.read_text(encoding='utf-8')
          content = re.sub(
              r"background-image:url\('data:image/png;base64,[^']+'\)",
              "background-image:url('/nassus-logo.svg')",
              content,
              count=1,
          )
          home.write_text(content, encoding='utf-8')

          shared_css = Path('assets/site.css')
          content = shared_css.read_text(encoding='utf-8')
          old = ".brand-mark{width:42px;height:42px;border-radius:12px;background:var(--dark);color:#fff;display:grid;place-items:center;font:800 18px var(--display);box-shadow:0 8px 18px rgba(11,19,38,.16);flex:0 0 auto}"
          new = ".brand-mark{width:42px;height:42px;border-radius:12px;background-color:var(--dark);background-image:url('/nassus-logo.svg');background-position:center;background-repeat:no-repeat;background-size:28px;color:transparent;display:grid;place-items:center;font:800 0 var(--display);box-shadow:0 8px 18px rgba(11,19,38,.16);flex:0 0 auto}"
          if old in content:
              content = content.replace(old, new)
          shared_css.write_text(content, encoding='utf-8')

          crm_css = Path('crm/app/globals.css')
          content = crm_css.read_text(encoding='utf-8')
          marker = '/* Marca original Nassus */'
          if marker not in content:
              content += '''\n\n/* Marca original Nassus */\n.login-brand > span,\n.crm-brand > span {\n  background-color: #0a1330;\n  background-image: url('/nassus-logo.svg');\n  background-position: center;\n  background-repeat: no-repeat;\n  background-size: 70%;\n  color: transparent;\n  font-size: 0;\n}\n'''
          crm_css.write_text(content, encoding='utf-8')

          layout = Path('crm/app/layout.tsx')
          content = layout.read_text(encoding='utf-8')
          if 'icons:' not in content:
              content = content.replace(
                  '  robots: { index: false, follow: false },',
                  '  robots: { index: false, follow: false },\n  icons: { icon: "/icon.svg", shortcut: "/icon.svg", apple: "/nassus-logo.svg" },',
              )
          layout.write_text(content, encoding='utf-8')

      - name: Publicar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' assets/site.css crm/app/globals.css crm/app/layout.tsx
          git commit -m "Aplicar logo original e favicons no site e CRM"
          git push
