name: Nassus Gestão CI

on:
  pull_request:
    paths:
      - "gestao/**"
      - ".github/workflows/gestao-ci.yml"
  push:
    branches:
      - "agent/nassus-gestao-mvp"
    paths:
      - "gestao/**"
      - ".github/workflows/gestao-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestao
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gestao/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
